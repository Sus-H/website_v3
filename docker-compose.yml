services:
  app:
    build: .
    container_name: website_v3
    restart: unless-stopped
    environment:
      - PORT=4000
    volumes:
      # Mount the host's /tmp directory directly into the container's /tmp
      - /tmp:/tmp
    # If you want to access the app directly via its TCP port (e.g., for debugging),
    # you can uncomment the following lines.
    # ports:
    #   - "4000:4000"
